name: Exec Bot Pronostici

on:
  schedule:
    # Esegue ogni giorno alle 08:00 UTC (modifica a piacere)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permette anche il lancio manuale da GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout codice
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installa Dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Esegui Bot
      env:
        FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python betting_bot.py