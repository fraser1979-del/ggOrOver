name: Bot Pronostici Telegram

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-bet-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice dal repository
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa le librerie
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas scipy

      - name: Esegui il Bot Pronostici
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python betting_bot.py