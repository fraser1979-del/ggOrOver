name: NBA Daily Analytics Cloud

on:
  schedule:
    # Esegue ogni mattina alle 06:00 UTC (08:00 ora italiana)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-daily-analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice dal repository
      uses: actions/checkout@v4

    - name: Configura ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installa le librerie richieste
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Esegui l'analisi giornaliera
      run: python auto_daily.py

    - name: Salva il report Excel negli Artifacts di GitHub
      uses: actions/upload-artifact@v4
      with:
        name: NBA-Daily-Report
        path: Report_Giornalieri/*.xlsx