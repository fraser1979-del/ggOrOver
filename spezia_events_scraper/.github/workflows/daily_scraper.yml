name: Scraper Sagre La Spezia

on:
  schedule:
    # Esegue lo script ogni mattina alle 06:00 UTC (08:00 ora italiana CEST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permette anche l'esecuzione manuale con un click su GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ripristina la cache dei pacchetti
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas python-telegram-bot

      - name: Esegui lo Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Salva e committa lo storico CSV aggiornato
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add eventi_registrati.csv || true
          git commit -m "Automated update: registrati nuovi eventi [skip ci]" || exit 0
          git push